name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout 5m

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/dev'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.PORT }}
          source: docker-compose.yml
          target: /opt/kurut-bot

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.PORT }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_IDS,TELEGRAM_ASSISTANT_IDS,TELEGRAM_PROXY_URL,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,YOOKASSA_MANUAL_PAYMENT,YOOKASSA_RETURN_URL,WEB_DOMAIN,WEB_TG_CHANNEL_URL,WEB_TG_SUPPORT_URL,WEB_WA_SUPPORT_URL,WEB_NEW_VPN_GRANT_URL,WEB_NEW_VPN_GRANT_SECRET
          script: |
            set -e
            cd /opt/kurut-bot
            mkdir -p data

            echo "=== Login ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pull ==="
            docker pull ${{ needs.docker.outputs.image-tag }}

            echo "=== Deploy ==="
            export IMAGE_TAG="${{ needs.docker.outputs.image-tag }}"
            export TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            export TELEGRAM_ADMIN_IDS="$TELEGRAM_ADMIN_IDS"
            export TELEGRAM_ASSISTANT_IDS="$TELEGRAM_ASSISTANT_IDS"
            export TELEGRAM_PROXY_URL="$TELEGRAM_PROXY_URL"
            export YOOKASSA_SHOP_ID="$YOOKASSA_SHOP_ID"
            export YOOKASSA_SECRET_KEY="$YOOKASSA_SECRET_KEY"
            export YOOKASSA_MANUAL_PAYMENT="$YOOKASSA_MANUAL_PAYMENT"
            export YOOKASSA_RETURN_URL="$YOOKASSA_RETURN_URL"
            export WEB_DOMAIN="$WEB_DOMAIN"
            export WEB_TG_CHANNEL_URL="$WEB_TG_CHANNEL_URL"
            export WEB_TG_SUPPORT_URL="$WEB_TG_SUPPORT_URL"
            export WEB_WA_SUPPORT_URL="$WEB_WA_SUPPORT_URL"
            export WEB_NEW_VPN_GRANT_URL="$WEB_NEW_VPN_GRANT_URL"
            export WEB_NEW_VPN_GRANT_SECRET="$WEB_NEW_VPN_GRANT_SECRET"

            docker compose up -d

            echo "=== Wait for container ==="
            sleep 5

            echo "=== Migrations ==="
            docker exec kurut-bot goose -dir /app/migrations sqlite3 /app/data/kurut.db up

            echo "=== Healthcheck ==="
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' kurut-bot 2>/dev/null || echo "starting")
              echo "[$i/30] $STATUS"
              [ "$STATUS" = "healthy" ] && echo "OK!" && docker image prune -f && exit 0
              [ "$STATUS" = "unhealthy" ] && docker logs kurut-bot --tail 30 && exit 1
              sleep 2
            done
            echo "Timeout!" && docker logs kurut-bot --tail 30 && exit 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ vars.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_ASSISTANT_IDS: ${{ vars.TELEGRAM_ASSISTANT_IDS }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_MANUAL_PAYMENT: ${{ vars.YOOKASSA_MANUAL_PAYMENT }}
          YOOKASSA_RETURN_URL: ${{ vars.YOOKASSA_RETURN_URL }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_TG_CHANNEL_URL: ${{ vars.WEB_TG_CHANNEL_URL }}
          WEB_TG_SUPPORT_URL: ${{ vars.WEB_TG_SUPPORT_URL }}
          WEB_WA_SUPPORT_URL: ${{ vars.WEB_WA_SUPPORT_URL }}
          WEB_NEW_VPN_GRANT_URL: ${{ vars.WEB_NEW_VPN_GRANT_URL }}
          WEB_NEW_VPN_GRANT_SECRET: ${{ secrets.WEB_NEW_VPN_GRANT_SECRET }}

      - name: Emit deployment annotation to VictoriaMetrics
        if: success()
        continue-on-error: true
        env:
          VM_PUSH_URL: ${{ secrets.VM_PUSH_URL }}
          VM_PUSH_USER: ${{ secrets.VM_PUSH_USER }}
          VM_PUSH_PASSWORD: ${{ secrets.VM_PUSH_PASSWORD }}
        run: |
          if [ -z "$VM_PUSH_URL" ]; then
            echo "VM_PUSH_URL secret not set — skipping deployment annotation"
            exit 0
          fi
          VERSION="${GITHUB_SHA::7}"
          TS_MS=$(($(date +%s) * 1000))
          echo "deployment_event{service=\"bot\",env=\"staging\",version=\"$VERSION\"} 1 $TS_MS" | \
            curl --fail --silent --show-error \
              -u "$VM_PUSH_USER:$VM_PUSH_PASSWORD" \
              -X POST "$VM_PUSH_URL" \
              -H "Content-Type: text/plain" --data-binary @-

  deploy-production:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.PORT }}
          source: docker-compose.yml
          target: /opt/kurut-bot

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.PORT }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_IDS,TELEGRAM_ASSISTANT_IDS,TELEGRAM_PROXY_URL,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,YOOKASSA_MANUAL_PAYMENT,YOOKASSA_RETURN_URL,WEB_DOMAIN,WEB_TG_CHANNEL_URL,WEB_TG_SUPPORT_URL,WEB_WA_SUPPORT_URL,WEB_NEW_VPN_GRANT_URL,WEB_NEW_VPN_GRANT_SECRET
          script: |
            set -e
            cd /opt/kurut-bot
            mkdir -p data

            echo "=== Login ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pull ==="
            docker pull ${{ needs.docker.outputs.image-tag }}

            echo "=== Deploy ==="
            export IMAGE_TAG="${{ needs.docker.outputs.image-tag }}"
            export TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
            export TELEGRAM_ADMIN_IDS="$TELEGRAM_ADMIN_IDS"
            export TELEGRAM_ASSISTANT_IDS="$TELEGRAM_ASSISTANT_IDS"
            export TELEGRAM_PROXY_URL="$TELEGRAM_PROXY_URL"
            export YOOKASSA_SHOP_ID="$YOOKASSA_SHOP_ID"
            export YOOKASSA_SECRET_KEY="$YOOKASSA_SECRET_KEY"
            export YOOKASSA_MANUAL_PAYMENT="$YOOKASSA_MANUAL_PAYMENT"
            export YOOKASSA_RETURN_URL="$YOOKASSA_RETURN_URL"
            export WEB_DOMAIN="$WEB_DOMAIN"
            export WEB_TG_CHANNEL_URL="$WEB_TG_CHANNEL_URL"
            export WEB_TG_SUPPORT_URL="$WEB_TG_SUPPORT_URL"
            export WEB_WA_SUPPORT_URL="$WEB_WA_SUPPORT_URL"
            export WEB_NEW_VPN_GRANT_URL="$WEB_NEW_VPN_GRANT_URL"
            export WEB_NEW_VPN_GRANT_SECRET="$WEB_NEW_VPN_GRANT_SECRET"

            docker compose up -d

            echo "=== Wait for container ==="
            sleep 5

            echo "=== Migrations ==="
            docker exec kurut-bot goose -dir /app/migrations sqlite3 /app/data/kurut.db up

            echo "=== Healthcheck ==="
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' kurut-bot 2>/dev/null || echo "starting")
              echo "[$i/30] $STATUS"
              [ "$STATUS" = "healthy" ] && echo "OK!" && docker image prune -f && exit 0
              [ "$STATUS" = "unhealthy" ] && docker logs kurut-bot --tail 30 && exit 1
              sleep 2
            done
            echo "Timeout!" && docker logs kurut-bot --tail 30 && exit 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ vars.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_ASSISTANT_IDS: ${{ vars.TELEGRAM_ASSISTANT_IDS }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          YOOKASSA_MANUAL_PAYMENT: ${{ vars.YOOKASSA_MANUAL_PAYMENT }}
          YOOKASSA_RETURN_URL: ${{ vars.YOOKASSA_RETURN_URL }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_TG_CHANNEL_URL: ${{ vars.WEB_TG_CHANNEL_URL }}
          WEB_TG_SUPPORT_URL: ${{ vars.WEB_TG_SUPPORT_URL }}
          WEB_WA_SUPPORT_URL: ${{ vars.WEB_WA_SUPPORT_URL }}
          WEB_NEW_VPN_GRANT_URL: ${{ vars.WEB_NEW_VPN_GRANT_URL }}
          WEB_NEW_VPN_GRANT_SECRET: ${{ secrets.WEB_NEW_VPN_GRANT_SECRET }}

      - name: Emit deployment annotation to VictoriaMetrics
        if: success()
        continue-on-error: true
        env:
          VM_PUSH_URL: ${{ secrets.VM_PUSH_URL }}
          VM_PUSH_USER: ${{ secrets.VM_PUSH_USER }}
          VM_PUSH_PASSWORD: ${{ secrets.VM_PUSH_PASSWORD }}
        run: |
          if [ -z "$VM_PUSH_URL" ]; then
            echo "VM_PUSH_URL secret not set — skipping deployment annotation"
            exit 0
          fi
          VERSION="${GITHUB_SHA::7}"
          TS_MS=$(($(date +%s) * 1000))
          echo "deployment_event{service=\"bot\",env=\"prod\",version=\"$VERSION\"} 1 $TS_MS" | \
            curl --fail --silent --show-error \
              -u "$VM_PUSH_USER:$VM_PUSH_PASSWORD" \
              -X POST "$VM_PUSH_URL" \
              -H "Content-Type: text/plain" --data-binary @-

  notify-failure:
    needs: [test, lint, docker, deploy-staging, deploy-production]
    # Only alert on real deploy refs (main=prod, dev=staging) — never on PR CI.
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Alert critical Telegram topic
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            echo "TELEGRAM_ALERT_BOT_TOKEN not set — skipping failure alert"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then ENVNAME=prod; else ENVNAME=staging; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf '🔴 <b>Deploy pipeline failed</b>\n\n<b>Service:</b> kurut-bot\n<b>Env:</b> %s\n<b>Commit:</b> <code>%s</code>\n<b>Branch:</b> %s\n\n<a href="%s">→ View run</a>' \
            "$ENVNAME" "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$RUN_URL")
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id=-1003901212224 \
            -d message_thread_id=2 \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}"
