version: '3.8'

services:
  bot:
    image: ${IMAGE_TAG:-kurut-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kurut-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_IDS=${TELEGRAM_ADMIN_IDS}
      - TELEGRAM_ASSISTANT_IDS=${TELEGRAM_ASSISTANT_IDS}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - YOOKASSA_MANUAL_PAYMENT=${YOOKASSA_MANUAL_PAYMENT:-false}
      - YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL}
      - WEB_DOMAIN=${WEB_DOMAIN:-https://kurutvpn.com}
      - WEB_TG_CHANNEL_URL=${WEB_TG_CHANNEL_URL:-https://t.me/kurutkyrgyz}
      - WEB_TG_SUPPORT_URL=${WEB_TG_SUPPORT_URL:-https://t.me/kurutsupport}
      - WEB_WA_SUPPORT_URL=${WEB_WA_SUPPORT_URL:-https://wa.me/79670042901}
      - WEB_NEW_VPN_GRANT_URL=${WEB_NEW_VPN_GRANT_URL:-https://kurutpro.ru/api/migration/grant}
      - WEB_NEW_VPN_GRANT_SECRET=${WEB_NEW_VPN_GRANT_SECRET}
      - DB_PATH=${DB_PATH:-/app/data/kurut.db}
      - OBSERVABILITY_HOST=0.0.0.0
    ports:
      - "8080:8080"
      - "9091:8383"
    volumes:
      - ./data:/app/data
    networks:
      - kurut-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep kurut-bot || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Dozzle - web UI for viewing Docker container logs
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: "info"
    networks:
      - kurut-network

networks:
  kurut-network:
    driver: bridge

volumes:
  bot-data:
    driver: local

